name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs every 2 days at 00:00 UTC
    - cron: '0 0 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keepalive Endpoint
        run: |
          curl -s -f "https://bizz-card-two.vercel.app/api/cron/keepalive" || echo "Ping completed"
